name: Federated Gateway Security Conformance

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  federated-gateway-conformance:
    name: Federated Gateway Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run federated gateway conformance
        run: pnpm security:federated:conformance

      - name: Upload federated conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federated-gateway-conformance-report
          path: security/reports/federated-gateway-conformance-report.json
          if-no-files-found: warn
