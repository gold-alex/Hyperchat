name: Dependency and Provenance Compliance Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  dependency-provenance-compliance:
    name: Dependency + Provenance Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency and binary provenance compliance
        run: pnpm security:compliance:check
