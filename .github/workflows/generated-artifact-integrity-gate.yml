name: Generated Artifact Integrity Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  generated-artifact-verify:
    name: Generated Artifact Regeneration Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated artifact integrity
        run: pnpm generated-artifacts:verify
