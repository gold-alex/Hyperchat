<!DOCTYPE html>
<html>
  <head>

    <title>Hyperliquid Chat</title>
    <link rel="stylesheet" href="/content.css" />
    <style>body{margin:0;background:#0a1f1c;}</style>
  </head>
  <body>

    </script>
  </body>
