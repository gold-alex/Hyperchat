##
## HyperChat anchor relay.
##
## The difference between this and the public relays the extension also talks to:
## this one never prunes, and it only accepts HyperChat traffic. It is the archive
## the rooms fall back to.
##

db = "/app/strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0

    # Set this if you terminate TLS in front of the relay, so rate limiting sees
    # the real client rather than your proxy.
    realIpHeader = ""

    info {
        name = "HyperChat"
        description = "Anchor relay for HyperChat rooms on Hyperliquid markets"
        pubkey = ""
        contact = ""
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55
    enableTcpKeepalive = true
    queryTimesliceBudgetMicroseconds = 10000

    # The client asks for 500 events of history per room.
    maxFilterLimit = 500
    maxSubsPerConnection = 20

    writePolicy {
        plugin = "/usr/bin/node /app/write-policy.js"
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }
}
